name: "Linux Build"

on: [push]

jobs:
  native:
    name: 'Arch Linux: ${{ matrix.compiler.vendor }}'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { vendor: gnu,  CC: gcc }
          - { vendor: llvm, CC: clang }

    steps:
    - name: Install packages
      run: pacman -Syu --noconfirm --needed
               base-devel
               check
               clang
               cmake
               curl
               expat
               git
               gtk4
               libjpeg-turbo
               libpng
               libwebp
               ninja
               openssl
               quickjs-ng
               words

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Configure
      env:
        CC: ${{ matrix.compiler.CC }}
      run: cmake -B build -G Ninja

    - name: Build
      run: cmake --build build

    - name: Unit Tests
      run: ctest --test-dir build --output-on-failure
