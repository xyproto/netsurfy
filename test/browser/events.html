<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Events</title><script src="harness.js"></script></head>
<body><script>
test("event constructors", function () {
    ["FocusEvent", "ErrorEvent", "MessageEvent", "PopStateEvent", "InputEvent", "WheelEvent",
     "HashChangeEvent", "ProgressEvent", "SubmitEvent", "CloseEvent"].forEach(function (name) {
        var e = new window[name]("x", { bubbles: true });
        assert(e instanceof window[name], name);
        assert(e instanceof Event, name);
        assert(e.bubbles, name);
    });
    assertEquals(new ErrorEvent("error", { message: "m" }).message, "m");
    assertEquals(new WheelEvent("wheel", { deltaY: 3 }).deltaY, 3);
});
test("interfaces the engine never fires are not exposed", function () {
    assertEquals(typeof window.PointerEvent, "undefined");
    assertEquals(typeof window.TouchEvent, "undefined");
});
test("window.dispatchEvent reaches window listeners", function () {
    var seen = null;
    window.addEventListener("custom-x", function (e) { seen = e; });
    var e = new CustomEvent("custom-x", { detail: 7, cancelable: true });
    window.addEventListener("custom-x", function (ev) { ev.preventDefault(); });
    assertEquals(window.dispatchEvent(e), false);
    assertEquals(seen && seen.detail, 7);
});
test("legacy keyboard codes", function () {
    assertEquals(new KeyboardEvent("keydown", { key: "Enter" }).keyCode, 13);
    assertEquals(new KeyboardEvent("keydown", { key: "a" }).keyCode, 65);
    assertEquals(new KeyboardEvent("keypress", { key: "a" }).charCode, 97);
});
test("window compatibility members", function () {
    assertEquals(confirm("x"), false);
    assertEquals(prompt("x"), null);
    assertEquals(open("about:blank"), null);
    assertEquals(document.execCommand("copy"), false);
});
test("media elements reject play()", function () {
    var v = document.createElement("video");
    assert(v.play() instanceof Promise);
    assertEquals(v.canPlayType("video/mp4"), "");
});
var pending = 3;
function finish() {
    if (--pending === 0) {
        test("global EventTarget methods with undefined this", function () {
    "use strict";
    var fired = 0;
    var add = window.addEventListener;
    function h() { fired++; }
    add("bare-test", h);
    addEventListener("bare-test", h, true);
    dispatchEvent(new Event("bare-test"));
    removeEventListener("bare-test", h);
    removeEventListener("bare-test", h, true);
    dispatchEvent(new Event("bare-test"));
    assertEquals(fired, 2);
});
done();
    }
}
window.addEventListener("message", function (e) {
    test("postMessage delivers a cloned message", function () {
        assertEquals(e.data.a, 1);
        assertEquals(e.source, window);
    });
    finish();
});
postMessage({ a: 1 }, "*");
var dialog = document.body.appendChild(document.createElement("dialog"));
dialog.addEventListener("close", function () {
    test("dialog close event and returnValue", function () {
        assertEquals(dialog.returnValue, "ok");
        assert(!dialog.open);
    });
    finish();
});
dialog.showModal();
dialog.close("ok");
test("performance marks and measures", function () {
    var a = performance.mark("a");
    performance.mark("b");
    var m = performance.measure("ab", "a", "b");
    assertEquals(a.entryType, "mark");
    assertEquals(m.entryType, "measure");
    assert(m.duration >= 0);
    assertEquals(performance.getEntriesByName("ab").length, 1);
    assertEquals(performance.getEntriesByType("mark").length, 2);
    performance.clearMarks("a");
    assertEquals(performance.getEntriesByType("mark").length, 1);
    assert(PerformanceObserver.supportedEntryTypes.indexOf("mark") >= 0);
});
var blobUrl = URL.createObjectURL(new Blob(["blob text"], { type: "text/plain" }));
fetch(blobUrl).then(function (r) {
    return r.text().then(function (t) {
        test("fetch from object URLs", function () {
            assertEquals(blobUrl.slice(0, 5), "blob:");
            assertEquals(r.headers.get("content-type"), "text/plain");
            assertEquals(t, "blob text");
        });
        URL.revokeObjectURL(blobUrl);
        return fetch(blobUrl).then(function () {
            test("revoked object URLs fail", function () { assert(false); });
        }, function (e) {
            test("revoked object URLs fail", function () { assert(e instanceof TypeError); });
        });
    });
}).then(finish, function (e) {
    test("fetch from object URLs", function () { throw e; });
    finish();
});
</script></body></html>
